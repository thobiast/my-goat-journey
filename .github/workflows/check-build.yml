name: Check and build

on:
  push:
  pull_request:
  workflow_dispatch:

# No deployment permissions or runtime secrets. Fork PR code runs only here,
# never under pull_request_target or workflow_run with an elevated token.
permissions:
  contents: read

jobs:
  check-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the event revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; verified upstream commit
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Read Node version from the development image
        id: node-version
        # Reuse the exact version in the digest-pinned development stage.
        # Fail closed if its format changes rather than silently choosing latest.
        run: |
          set -euo pipefail
          read -r development_stage < Containerfile
          if [[ "$development_stage" =~ ^FROM\ docker.io/library/node:([0-9]+\.[0-9]+\.[0-9]+)-bookworm-slim@sha256:[0-9a-f]{64}\ AS\ development$ ]]; then
            printf 'version=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo 'Expected an exact Node version in the pinned development stage of Containerfile.' >&2
            exit 1
          fi

      - name: Set up the project Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6; verified upstream commit
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          check-latest: false
          package-manager-cache: false

      - name: Install from the committed lockfile
        run: |
          set -euo pipefail
          test -f package-lock.json
          sha256sum package-lock.json > "$RUNNER_TEMP/my-goat-package-lock.sha256"
          npm ci
          sha256sum --check "$RUNNER_TEMP/my-goat-package-lock.sha256"

      - name: Type check and test
        run: |
          set -euo pipefail
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test

      - name: Build the shared production artifact
        # The shared npm build owns assembly and reads the committed shared
        # prefix configuration. CI deliberately supplies no separate default.
        run: |
          set -euo pipefail
          npm run build
          sha256sum --check "$RUNNER_TEMP/my-goat-package-lock.sha256"
          test -f dist/index.html
          test -f dist/app/index.html
          test -f dist/app/sw.js
          cmp LICENSE dist/app/LICENSE
          cmp public/third-party-notices.txt dist/app/third-party-notices.txt

      - name: Upload the build for manual review (not deployment)
        # Review-only retention follows the default branch. Pages publication
        # is a separate, explicitly manual main-branch workflow.
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2; verified upstream commit
        with:
          name: my-goat-journey-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
          overwrite: false
