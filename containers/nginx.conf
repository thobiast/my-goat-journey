pid /tmp/nginx.pid;
error_log /dev/stderr;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  map $uri $app_cache_control {
    default "no-cache";
    "~^__APP_BASE__assets/.+-[A-Za-z0-9_-]{8,}\\.(js|css)$" "public, max-age=31536000, immutable";
  }
  server {
    listen 8080;
    absolute_redirect off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control $app_cache_control always;
    location = /health { default_type text/plain; return 200 'ok'; }
    __PREFIX_REDIRECT__
    location = __APP_ENTRY__ { return 301 __APP_BASE__; }
    location = __APP_BASE__sw.js { try_files $uri =404; }
    location __APP_BASE__assets/ { try_files $uri =404; }
    location __APP_BASE__icons/ { try_files $uri =404; }
    location __APP_BASE__branding/ { try_files $uri =404; }
    location ~ \.(js|css|map|png|ico|svg|woff2?|json)$ { try_files $uri =404; }
    location ~ \.webmanifest$ {
      types { application/manifest+json webmanifest; }
      try_files $uri =404;
    }
    location __SITE_PREFIX__ { try_files $uri $uri/ =404; }
    __OUTSIDE_PREFIX__
  }
}
